site_name: mConfig Documentation
docs_dir: src/site/markdown
site_dir: target/mkdocs
use_directory_urls: false

theme:
#  name: material
  name: readthedocs
  features:
    - navigation.footer

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - footnotes
  - attr_list
  - def_list
#  - pymdownx.details
# superfences replaces fenced_code; ```mermaid blocks become <div class="mermaid">,
# drawn in the browser by the script under extra_javascript.
# Needs the package pymdown-extensions next to mkdocs (pipx inject mkdocs pymdown-extensions).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
#  - pymdownx.highlight

plugins:
  - search

# the readthedocs theme does not load Mermaid by itself (material would)
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - js/mermaid-init.js

